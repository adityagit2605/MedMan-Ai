spring.application.name=healthcare-manager
server.port=8080

# ── PostgreSQL ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── JWT ──────────────────────────────────────────────────────────────────────
# Generate a strong secret: openssl rand -base64 64
app.jwt.secret=VGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIEpXVCB0b2tlbiBzaWduaW5n
app.jwt.access-token-expiry-ms=900000
# 15 minutes
app.jwt.refresh-token-expiry-ms=604800000
# 7 days

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── LLM Service ──────────────────────────────────────────────────────────────
app.llm.service.url=http://localhost:8000

# ── Slot Hold ────────────────────────────────────────────────────────────────
app.slot.hold.minutes=5
app.slot.redis.lock.ttl.ms=5000

# ── Email (SMTP) ─────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.from=noreply@healthcare-manager.com
